[package]
name = "cc-ledger"
version = "0.0.1"
edition = "2021"
description = "Local-first ledger of Claude Code edits and per-turn token usage, attached to git commits as a Git Note."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
similar = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
imara-diff = "0.1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
ureq = { version = "2", features = ["json"] }
webbrowser = "1"
fs2 = "0.4"
dialoguer = { version = "0.11", default-features = false }
flate2 = "1"
tar = "0.4"
base64 = "0.22"
regex = "1"
comfy-table = "~7.1"  # 7.2 needs Rust 1.86; we're pinned to 1.85
owo-colors = "4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
