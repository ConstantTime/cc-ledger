# Snapshot of Anthropic API pricing — used as the embedded fallback baked
# into the binary at build time.
#
# Runtime override lookup (in priority order):
#   1. $CC_LEDGER_PRICING (path)
#   2. ~/.cc-ledger/pricing.toml
#   3. this file (compiled in)
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing
# Order does not matter at lookup time — the loader sorts by prefix length
# descending so the most-specific match wins (e.g. claude-opus-4-7 beats
# claude-opus-4 when resolving claude-opus-4-7-20260301).

pricing_version = 1
as_of           = "2026-05-02"
source          = "https://platform.claude.com/docs/en/about-claude/pricing"

# ─── Opus 4.5+ family ($5 input / $25 output) ──────────────────────────────
[[models]]
prefix                  = "claude-opus-4-7"
input_per_mtok          = 5.00
cache_write_5m_per_mtok = 6.25
cache_write_1h_per_mtok = 10.00
cache_read_per_mtok     = 0.50
output_per_mtok         = 25.00

